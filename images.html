<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    .gallery {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #222 0%, #050505 65%);
    }

    .slides {
        display: flex;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
    }

    .slides::-webkit-scrollbar {
        display: none;
    }

    .slide {
        position: relative;
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        scroll-snap-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .slide::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                to bottom,
                rgba(0,0,0,.35),
                transparent 25%,
                transparent 70%,
                rgba(0,0,0,.65)
            );
        pointer-events: none;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        -webkit-user-drag: none;
        animation: zoom 8s ease-in-out infinite alternate;
    }

    @keyframes zoom {
        from {
            transform: scale(1);
        }
        to {
            transform: scale(1.045);
        }
    }

    .top {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        right: 0;
        padding: 28px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
    }

    .title {
        font-size: clamp(20px, 3vw, 34px);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 15px rgba(0,0,0,.6);
    }

    .counter {
        font-size: 14px;
        color: rgba(255,255,255,.75);
        letter-spacing: 1px;
    }

    .arrow {
        position: absolute;
        z-index: 10;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 50%;
        background: rgba(0,0,0,.28);
        backdrop-filter: blur(10px);
        color: white;
        font-size: 28px;
        cursor: pointer;
        transition: .25s;
    }

    .arrow:hover {
        background: rgba(255,255,255,.18);
        border-color: white;
        transform: translateY(-50%) scale(1.08);
    }

    .prev {
        left: 25px;
    }

    .next {
        right: 25px;
    }

    .bottom {
        position: absolute;
        z-index: 10;
        left: 0;
        right: 0;
        bottom: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
    }

    .dots {
        display: flex;
        gap: 9px;
        padding: 10px 15px;
        border-radius: 30px;
        background: rgba(0,0,0,.3);
        backdrop-filter: blur(12px);
        pointer-events: auto;
    }

    .dot {
        width: 8px;
        height: 8px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,.4);
        cursor: pointer;
        transition: .3s;
    }

    .dot.active {
        width: 25px;
        border-radius: 10px;
        background: white;
    }

    .hint {
        position: absolute;
        z-index: 10;
        bottom: 75px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255,255,255,.55);
        font-size: 12px;
        opacity: 1;
        transition: opacity 1s;
        pointer-events: none;
    }

    .hint.hidden {
        opacity: 0;
    }

    .fullscreen {
        position: absolute;
        z-index: 10;
        top: 24px;
        right: 90px;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 50%;
        color: white;
        background: rgba(0,0,0,.25);
        backdrop-filter: blur(10px);
        cursor: pointer;
        font-size: 17px;
    }

    .fullscreen:hover {
        background: rgba(255,255,255,.15);
    }

    @media (max-width: 600px) {
        .top {
            padding: 20px;
        }

        .arrow {
            width: 44px;
            height: 44px;
            font-size: 22px;
        }

        .prev {
            left: 12px;
        }

        .next {
            right: 12px;
        }

        .fullscreen {
            right: 65px;
            top: 17px;
        }
    }
</style>

</head>

<body>

<div class="gallery">

```
<div class="top">
    <div class="title">GALLERY</div>
    <div class="counter">
        <span id="current">1</span> / 5
    </div>
</div>

<button class="fullscreen" onclick="toggleFullscreen()" title="Fullscreen">
    ⛶
</button>

<button class="arrow prev" onclick="previous()" aria-label="Previous">
    ‹
</button>

<div class="slides" id="slides">

    <div class="slide">
        <img src="1.jpg" alt="Image 1" draggable="false">
    </div>

    <div class="slide">
        <img src="2.jpg" alt="Image 2" draggable="false">
    </div>

    <div class="slide">
        <img src="3.jpg" alt="Image 3" draggable="false">
    </div>

    <div class="slide">
        <img src="4.jpg" alt="Image 4" draggable="false">
    </div>

    <div class="slide">
        <img src="5.jpg" alt="Image 5" draggable="false">
    </div>

</div>

<button class="arrow next" onclick="next()" aria-label="Next">
    ›
</button>

<div class="hint" id="hint">
    Swipe · Scroll · Use ← →
</div>

<div class="bottom">
    <div class="dots" id="dots">

        <button class="dot active" onclick="goTo(0)"></button>
        <button class="dot" onclick="goTo(1)"></button>
        <button class="dot" onclick="goTo(2)"></button>
        <button class="dot" onclick="goTo(3)"></button>
        <button class="dot" onclick="goTo(4)"></button>

    </div>
</div>
```

</div>

<script>

const slides = document.getElementById("slides");
const dots = document.querySelectorAll(".dot");
const current = document.getElementById("current");
const hint = document.getElementById("hint");

let index = 0;
let autoPlay;


/* Go to slide */

function goTo(i) {

    index = Math.max(0, Math.min(4, i));

    slides.scrollTo({
        left: index * slides.clientWidth,
        behavior: "smooth"
    });

    updateUI();
}


/* Next */

function next() {

    if (index >= 4) {
        goTo(0);
    } else {
        goTo(index + 1);
    }

}


/* Previous */

function previous() {

    if (index <= 0) {
        goTo(4);
    } else {
        goTo(index - 1);
    }

}


/* Update dots and counter */

function updateUI() {

    current.textContent = index + 1;

    dots.forEach((dot, i) => {
        dot.classList.toggle(
            "active",
            i === index
        );
    });

}


/* Detect manual scrolling */

let scrollTimer;

slides.addEventListener("scroll", () => {

    clearTimeout(scrollTimer);

    scrollTimer = setTimeout(() => {

        const newIndex = Math.round(
            slides.scrollLeft / slides.clientWidth
        );

        if (newIndex !== index) {
            index = newIndex;
            updateUI();
        }

    }, 80);

});


/* Keyboard */

document.addEventListener("keydown", event => {

    if (event.key === "ArrowRight") {
        next();
    }

    if (event.key === "ArrowLeft") {
        previous();
    }

    if (event.key === " ") {
        event.preventDefault();
        toggleAutoPlay();
    }

});


/* Auto-play */

function startAutoPlay() {

    autoPlay = setInterval(() => {
        next();
    }, 5000);

}

function stopAutoPlay() {

    clearInterval(autoPlay);

}

function toggleAutoPlay() {

    if (autoPlay) {
        stopAutoPlay();
        autoPlay = null;
    } else {
        startAutoPlay();
    }

}


/* Pause when mouse is over gallery */

document
    .querySelector(".gallery")
    .addEventListener("mouseenter", stopAutoPlay);

document
    .querySelector(".gallery")
    .addEventListener("mouseleave", startAutoPlay);


/* Fullscreen */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document
            .documentElement
            .requestFullscreen()
            .catch(() => {});

    } else {

        document.exitFullscreen();

    }

}


/* Hide usage hint */

setTimeout(() => {

    hint.classList.add("hidden");

}, 3500);


/* Start */

startAutoPlay();

</script>

</body>
</html>

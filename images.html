<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>



</head>

<body>

<div class="gallery">

```
<div class="top">
    <div class="title">GALLERY</div>
    <div class="counter">
        <span id="current">1</span> / 5
    </div>
</div>

<button class="fullscreen" onclick="toggleFullscreen()" title="Fullscreen">
    ⛶
</button>

<button class="arrow prev" onclick="previous()" aria-label="Previous">
    ‹
</button>

<div class="slides" id="slides">

    <div class="slide">
        <img src="1.jpg" alt="Image 1" draggable="false">
    </div>

    <div class="slide">
        <img src="2.jpg" alt="Image 2" draggable="false">
    </div>

    <div class="slide">
        <img src="3.jpg" alt="Image 3" draggable="false">
    </div>

    <div class="slide">
        <img src="4.jpg" alt="Image 4" draggable="false">
    </div>

    <div class="slide">
        <img src="5.jpg" alt="Image 5" draggable="false">
    </div>

</div>

<button class="arrow next" onclick="next()" aria-label="Next">
    ›
</button>

<div class="hint" id="hint">
    Swipe · Scroll · Use ← →
</div>

<div class="bottom">
    <div class="dots" id="dots">

        <button class="dot active" onclick="goTo(0)"></button>
        <button class="dot" onclick="goTo(1)"></button>
        <button class="dot" onclick="goTo(2)"></button>
        <button class="dot" onclick="goTo(3)"></button>
        <button class="dot" onclick="goTo(4)"></button>

    </div>
</div>
```

</div>

<script>

const slides = document.getElementById("slides");
const dots = document.querySelectorAll(".dot");
const current = document.getElementById("current");
const hint = document.getElementById("hint");

let index = 0;
let autoPlay;


/* Go to slide */

function goTo(i) {

    index = Math.max(0, Math.min(4, i));

    slides.scrollTo({
        left: index * slides.clientWidth,
        behavior: "smooth"
    });

    updateUI();
}


/* Next */

function next() {

    if (index >= 4) {
        goTo(0);
    } else {
        goTo(index + 1);
    }

}


/* Previous */

function previous() {

    if (index <= 0) {
        goTo(4);
    } else {
        goTo(index - 1);
    }

}


/* Update dots and counter */

function updateUI() {

    current.textContent = index + 1;

    dots.forEach((dot, i) => {
        dot.classList.toggle(
            "active",
            i === index
        );
    });

}


/* Detect manual scrolling */

let scrollTimer;

slides.addEventListener("scroll", () => {

    clearTimeout(scrollTimer);

    scrollTimer = setTimeout(() => {

        const newIndex = Math.round(
            slides.scrollLeft / slides.clientWidth
        );

        if (newIndex !== index) {
            index = newIndex;
            updateUI();
        }

    }, 80);

});


/* Keyboard */

document.addEventListener("keydown", event => {

    if (event.key === "ArrowRight") {
        next();
    }

    if (event.key === "ArrowLeft") {
        previous();
    }

    if (event.key === " ") {
        event.preventDefault();
        toggleAutoPlay();
    }

});


/* Auto-play */

function startAutoPlay() {

    autoPlay = setInterval(() => {
        next();
    }, 5000);

}

function stopAutoPlay() {

    clearInterval(autoPlay);

}

function toggleAutoPlay() {

    if (autoPlay) {
        stopAutoPlay();
        autoPlay = null;
    } else {
        startAutoPlay();
    }

}


/* Pause when mouse is over gallery */

document
    .querySelector(".gallery")
    .addEventListener("mouseenter", stopAutoPlay);

document
    .querySelector(".gallery")
    .addEventListener("mouseleave", startAutoPlay);


/* Fullscreen */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document
            .documentElement
            .requestFullscreen()
            .catch(() => {});

    } else {

        document.exitFullscreen();

    }

}


/* Hide usage hint */

setTimeout(() => {

    hint.classList.add("hidden");

}, 3500);


/* Start */

startAutoPlay();

</script>

</body>
</html>
